apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  # Simple key-value pairs
  database_host: "db.production.svc.cluster.local"
  log_level: "info"
  
  # Multi-line file content (using the pipe '|' symbol)
  app.properties: |
    server.port=8080
    cache.ttl=3600
    feature.flags.enabled=true