apiVersion: v1
kind: ConfigMap
metadata:
  name: prune-test-config
data:
  key: value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prune-test-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prune-test
  template:
    metadata:
      labels:
        app: prune-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prune-test-cronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo hello"]
          restartPolicy: OnFailure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prune-test-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: prune-test # change to match the namespace this stack deploys into
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
