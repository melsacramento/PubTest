apiVersion: v1
kind: Namespace
metadata:
  name: force-recreate-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: force-recreate-job
  namespace: force-recreate-test
spec:
  template:
    spec:
      containers:
        - name: sleeper
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
      restartPolicy: Never
  backoffLimit: 0
